services:
# keycloak:
#   build:
#     context: keycloak
#   command: start-dev

  irods-catalog:
    build:
      context: irods_catalog
    environment:
      - POSTGRES_PASSWORD=testpassword
    restart: always

  irods-catalog-provider:
    build:
      context: irods_catalog_provider_v5
    init: true
    ports:
      - "1257:1247"
    shm_size: 100mb
    healthcheck:
      test: ["CMD-SHELL", "su - irods -c '[ -f /tmp/irods_server_setup_complete.flag ] && ils || exit 1'"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 10s
    restart: always
    depends_on:
      - irods-catalog
#     - keycloak
